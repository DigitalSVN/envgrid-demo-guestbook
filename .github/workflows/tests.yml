name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test
