name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-interaction --prefer-dist

      - run: vendor/bin/pint --test

      - name: Run tests
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test

  # Mirrors the EnvGrid preview bootstrap: production env, no dev dependencies.
  preview-boot:
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_CONNECTION: sqlite
      CACHE_STORE: file
      SESSION_DRIVER: cookie
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_sqlite
          coverage: none

      - run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Boot like a preview
        run: |
          APP_KEY="base64:$(openssl rand -base64 32)"
          export APP_KEY
          mkdir -p database && touch database/database.sqlite
          php artisan migrate --force --no-interaction
          php artisan db:seed --force --no-interaction
          php -S 127.0.0.1:8000 -t public public/index.php > /dev/null 2>&1 &
          sleep 2
          curl -fsS -o /dev/null http://127.0.0.1:8000/up
          curl -fsS http://127.0.0.1:8000/ | grep -q 'Sign the guestbook'
